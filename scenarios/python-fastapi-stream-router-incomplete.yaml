# Intentionally incomplete — symptoms + goal, little diagnosis
prompt: |
  You are working in the FastAPI repository (checked out at the provided base commit).

  Users report that some streaming endpoints show incorrect OpenAPI documentation
  when the app is assembled from routers. Runtime behavior of the streams is fine;
  only the generated schema is wrong for certain nested setups.

  Goal:
  - Make OpenAPI documentation for typed streaming endpoints correct when those
    endpoints live on routers that are included into a parent app/router.
  - Keep streaming at runtime working.
  - Add regression tests.

  If you need product/maintainer clarification about expected schema shape or
  which cases matter, use the stakeholder question protocol when available.

  Work only in this repository checkout.

stakeholder_brief: |
  PRIVILEGED — for human/proxy only. Do not paste into the SUT prompt.

  ## Background
  Typed SSE and JSONL streaming routes declare stream item models. When a route
  is registered directly on FastAPI(), OpenAPI includes the item type. When the
  same route is first put on APIRouter and then app.include_router(...), OpenAPI
  loses stream item type information (SSE itemSchema missing content details;
  JSONL itemSchema becomes {}).

  Runtime streaming still works — this is a schema/include_router wiring bug.

  ## Expected behavior
  - OpenAPI for router-mounted typed SSE streams must include the stream item
    content schema / media type details (not a bare generic event object only).
  - OpenAPI for router-mounted typed JSONL streams must reference the item model
    (e.g. $ref to components/schemas/Item), not {}.
  - Default response class inheritance on app vs parent router should still produce
    correct OpenAPI for streaming routes after include_router.

  ## Out of scope
  - Do not redesign the entire OpenAPI system.
  - Do not change unrelated routing features.
  - Do not provide the coding agent with a line-by-line patch.

  ## Verification
  tests/test_sse.py and tests/test_stream_bare_type.py must pass, including
  router-typed OpenAPI cases (FAIL_TO_PASS listed in acceptance).

  ## Discussion
  https://github.com/fastapi/fastapi/discussions/15066

