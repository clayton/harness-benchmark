# Source-port task adapted from the Tura Benchmark (MIT).
# Rust source: agourlay/zip-password-finder v0.11.1 (Apache-2.0).
id: zip-password-finder-python-port
type: rewrite
title: "Rewrite a ZIP password finder from Rust to Python"
description: >
  Rebuild a real Rust command-line application as a behavior-compatible,
  standard-library Python program. The task exercises source comprehension,
  binary-format handling, search generation, CLI compatibility, and error
  behavior. Published baseline runs take about 11 minutes and up to 3M tokens.
language: python
tags: [python, rust, rewrite, cli, zip, endurance, hard]
difficulty: hard
source: "https://github.com/Tura-AI/benchmark/tree/main/tasks/rewrite/zip-password-finder"

repo:
  url: "https://github.com/agourlay/zip-password-finder.git"
  base_ref: "7c1a4c93841220fc740ed81d3b97784e450fc6a6"

prompt: |
  You are working in zip-password-finder v0.11.1. The current repository is
  the Rust reference implementation.

  Rebuild this command-line application in Python. Produce a 1:1 functional
  port of its observable behavior.

  Deliverables:
  - Add an idempotent compile.sh at the repository root.
  - compile.sh must create a directly runnable Python file named executable
    at the repository root.
  - Use the Python standard library. Do not require package installation.
  - Preserve the v0.11.1 CLI, including option names, validation, exit status,
    stdout, and stderr behavior.
  - Support brute-force, dictionary, and mask attacks.
  - Support custom mask charsets and --startingPassword.
  - Support the ZipCrypto and WinZip AES files accepted by the reference.
  - Keep the implementation portable across Linux and macOS.

  The evaluator runs the same cases against the frozen Rust reference and your
  Python executable. Do not invoke, wrap, import, or shell out to the Rust
  implementation or another ZIP password finder. Do not use Docker or the
  network. Implement the behavior in Python.

  Do not ask questions. Inspect the source and complete the port.

acceptance:
  setup_commands:
    - "cargo build --release --locked"
    - "mkdir -p .hbench && cp target/release/zip-password-finder .hbench/zip-password-finder-reference"
    - "printf '\n.hbench/\n' >> .git/info/exclude"
  gold_files:
    - "hb_zip_password_finder_test.py"
  test_commands:
    - "python3 hb_zip_password_finder_test.py"
  build_commands:
    - "sh compile.sh"
  fail_to_pass:
    - "18 reference-equivalence assertions"
  notes: >
    Adapted from Tura's public 18-item source-port harness. The judge compares
    build and CLI structure plus brute-force, resume, not-found, dictionary,
    mask, custom charset, missing input, invalid workers, invalid lengths, and
    missing file selection. The public evaluator is overlaid only after the run.

allowed_paths:
  - "compile.sh"
  - "executable"
  - "*.py"

metadata:
  source_task: "Tura-AI/benchmark:tasks/rewrite/zip-password-finder"
  source_commit: "7c1a4c93841220fc740ed81d3b97784e450fc6a6"
  source_tag: "v0.11.1"
  source_license: "Apache-2.0"
  task_license: "MIT"
  evaluator_assertions: 18
  published_baseline: "Codex CLI, GPT-5.6-sol, 17/18 and 18/18 across two runs"

